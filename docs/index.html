<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peros — Train Focus Like a Skill</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <img src="./favicon.png" alt="Peros" class="brand-icon" />
        <span class="brand-name">Peros</span>
      </div>

      <nav class="nav-list" id="navList">
        <button class="nav-item active" data-page="today">Today</button>
        <button class="nav-item" data-page="stickyWall">Sticky Wall</button>
        <button class="nav-item" data-page="workLog">Work Log</button>
        <button class="nav-item" data-page="progress">Progress</button>
        <button class="nav-item" data-page="ritualsGoals">Rituals &amp; Goals</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="level-card" id="sidebarLevelCard"></div>
        <div class="sidebar-actions">
          <button class="btn-ghost" id="toggleThemeBtn" title="Toggle Light / Dark">Theme</button>
          <button class="btn-ghost" id="seedDemoBtn" title="Load sample data">Demo Data</button>
        </div>
      </div>
    </aside>

    <main class="main-content" id="mainContent"></main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
